name: Test and release extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test suite
        run: npm test
      - name: Assemble extension ZIP
        run: npm run pack
      - name: Verify ZIP structure
        run: |
          unzip -t dist/agent-boundary-watch-0.1.0.zip
          unzip -Z1 dist/agent-boundary-watch-0.1.0.zip | grep -Fx 'manifest.json'
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: dist/agent-boundary-watch-0.1.0.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: dist
      - name: Publish open-source v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 dist/agent-boundary-watch-0.1.0.zip --clobber
          else
            gh release create v0.1.0 dist/agent-boundary-watch-0.1.0.zip \
              --title 'Agent Boundary Watch v0.1.0' \
              --notes 'Phase 1: open-source, local-only Chrome extension permission exposure scanner. Download ZIP, extract, then load unpacked in Chrome. Chrome Web Store launch is planned for Phase 2.'
          fi
